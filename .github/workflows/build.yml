name: APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # hat das Android-SDK schon vorinstalliert
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android-SDK prüfen
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APK bauen
        run: |
          set -o pipefail
          gradle :app:assembleDebug 2>&1 | tee build.log

      - name: Fehler anzeigen
        if: failure()
        run: |
          # Kompilierfehler als Hinweise ausgeben (lesbar über die GitHub-API)
          grep -E "^e: |What went wrong|Could not|error:" -A4 build.log | head -60 > errors.txt || true
          split -l 12 errors.txt part_
          for f in part_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::error::$msg"
          done

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk EnduroFit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EnduroFit-APK
          path: EnduroFit.apk

      - name: Als Download "neueste Version" veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EnduroFit.apk \
            --title "EnduroFit – neueste Version (Build ${{ github.run_number }})" \
            --notes "Auf dem Handy herunterladen und installieren."
